name: Diagnose NYISO handshake

# Manual only. Answers one question the daily scrape cannot: what does
# nyiso.com actually return to a GitHub runner? The pages parse fine from a
# workstation, so the failure only exists here. Read-only — no scrape, no DB
# write, no commit, and it never gates the daily run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Only what the probe needs. Skips Playwright and the rest of
      # requirements.txt, so the run is seconds rather than minutes.
      - name: Install requests
        run: python -m pip install --upgrade pip requests

      - name: Probe nyiso.com from the runner
        working-directory: rto-docs
        run: python diagnose_nyiso.py
