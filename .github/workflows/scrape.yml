name: Scrape RTO docs

on:
  schedule:
    # Daily scrape: 11:00 UTC (~6 AM ET standard / 7 AM ET DST). Daily
    # cadence catches late-added meetings (especially CAISO) within a day,
    # which matters now that meetings can fire "Initiative-linked" tags
    # via the cross-reference scraper. Screening is gated on
    # meeting_screened_at IS NULL / ai_processed_at IS NULL so we only
    # spend Claude API on newly-discovered items.
    - cron: '0 11 * * *'
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write           # so the job can commit DB + JSON back

concurrency:
  group: scrape
  cancel-in-progress: false # never interrupt an in-flight scrape

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Scrape (download PDFs + extract text into DB)
        working-directory: rto-docs
        run: python run_scrapers.py --lookback 16 --lookahead 16

      - name: Screen meetings + documents (Claude)
        working-directory: rto-docs
        run: python screen_documents.py

      - name: Prune old extracted text (keeps the committed DB under GitHub's limit)
        # The DB is committed on every run, and extracted_text was ~75% of it —
        # 54 MB of 72 MB, growing ~0.75 MB/day and on track to cross GitHub's
        # 100 MB per-file HARD BLOCK (not a warning) around Sep 2026. Clearing
        # text for already-screened documents older than 60 days holds the file
        # at a steady state instead of growing without bound. The text is derived
        # data, re-fetchable from download_url; documents that have NOT been
        # screened are never pruned at any age, since clearing their text would
        # make them permanently unscreenable.
        #
        # Must run AFTER screening (which reads the text) and BEFORE the commit.
        working-directory: rto-docs
        run: python run_scrapers.py --prune-text 60

      - name: Backfill SPP member_url on pre-existing rows
        # The SPP scraper now records a folder-page member_url alongside the
        # '#z=' extraction address, but only for rows it re-reads. This fills
        # the rows scraped before the column existed, from their meeting's
        # folder page. Idempotent (only touches member_url IS NULL) and cheap,
        # so it also self-heals any row a future scrape misses.
        # Must run BEFORE the export so the JSON carries the durable links.
        working-directory: rto-docs
        run: python backfill_spp_member_url.py

      - name: Re-export calendar JSON
        working-directory: rto-docs
        run: python run_scrapers.py --export-only

      - name: Commit DB + JSON if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add rto-docs/db/rto_documents.db rto-docs/rto_events_with_docs.json rto-docs/rto_issues.json rto-docs/rto_hydro_corpus.json rto-docs/rto_hydro_corpus.csv
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Scrape: $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

      - name: Flag soft scraper failures
        # The scrape step now survives a single source failing so the healthy
        # RTOs still publish. If any scraper was skipped it leaves a marker;
        # fail the job here so the scheduled run still sends the usual GitHub
        # failure email. Runs after the commit so today's data is published
        # first; runs before the artifact upload so the logs get attached.
        if: always()
        working-directory: rto-docs
        run: |
          if [ -f logs/scraper_failures.txt ]; then
            echo "::error::Scraper(s) failed and were skipped (calendar still published from healthy sources): $(tr '\n' ' ' < logs/scraper_failures.txt)"
            exit 1
          fi
          echo "All scrapers succeeded."

      - name: Upload run log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-failure-logs
          path: rto-docs/logs/
          if-no-files-found: ignore
          retention-days: 14
